<section class="hero" aria-label="Ana sayfa hero bölümü">

  <!-- Background -->
  <div class="hero-bg" aria-hidden="true">
    <div class="hero-bg-gradient"></div>
    <div class="hero-bg-pattern"></div>
    <!-- Floating elements -->
    <div class="hero-float hero-float-1" aria-hidden="true">🧻</div>
    <div class="hero-float hero-float-2" aria-hidden="true">💧</div>
    <div class="hero-float hero-float-3" aria-hidden="true">🌿</div>
  </div>

  <!-- Content -->
  <div class="hero-content container-custom">

    <!-- Badge -->
    <div class="hero-badge">
      <span class="badge-dot" aria-hidden="true"></span>
      🇹🇷 Türkiye'nin Güvenilir Mendil Markası
    </div>

    <!-- Title -->
    <h1 class="hero-title">
      Yumuşaklığın<br>
      <span class="title-accent">Dokunuşu</span>
    </h1>

    <!-- Subtitle -->
    <p class="hero-subtitle">
      Doğa dostu, hijyenik ve ekstra yumuşak mendiller.<br class="hidden md:block">
      Her an yanınızda, her zaman güvenilir.
    </p>

    <!-- Actions -->
    <div class="hero-actions">
      <a routerLink="/urunler" class="btn-primary">
        Ürünleri Keşfet
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </a>
      <a routerLink="/hakkimizda" class="btn-secondary">
        Hakkımızda
      </a>
    </div>

    <!-- Stats -->
    <div class="hero-stats-row" role="list" aria-label="Marka istatistikleri">
      <div class="hero-stats" role="listitem">
        <span class="stat-number">15+</span>
        <span class="stat-label">Yıllık Deneyim</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="hero-stats" role="listitem">
        <span class="stat-number">50+</span>
        <span class="stat-label">Ürün Çeşidi</span>
      </div>
      <div class="stat-divider" aria-hidden="true"></div>
      <div class="hero-stats" role="listitem">
        <span class="stat-number">1M+</span>
        <span class="stat-label">Mutlu Müşteri</span>
      </div>
    </div>

  </div>

  <!-- Scroll Indicator -->
  <div class="hero-scroll" aria-hidden="true">
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
    <span>Aşağı kaydır</span>
  </div>

</section>
